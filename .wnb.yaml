# The dev loop (go tool task dev): rebuild whenever the source changes.
watch:
  extensions: [go]
  include: [go.mod, go.sum]
  exclude: ["*_test.go"]
  exclude_dirs: [build]

build:
  command: go tool task build

# A program that serves (a server, a daemon) is restarted after each
# successful build. A CLI or library has nothing to run: leave this out.
# run:
#   command: ./build/watchnbuild
